{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Helps the layout work well on phones and desktops. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Loads the Joshua Tree inspired stylesheet. -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <title>TrailTales</title>
</head>
<body>
    <!-- Shared navigation for the full TrailTales experience. -->
    <header>
        <nav>
            <a href="/">TrailTales</a>
            <a href="/discoveries/">Discoveries</a>
            <a href="/discoveries/new/">Add Discovery</a>
            <a href="/admin/">Admin</a>

            <span class="nav-spacer"></span>

            {% if user.is_authenticated %}
                <span class="nav-user">Hi, {{ user.username }}</span>

                <form class="logout-form" action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>

    <!-- Each page places its unique content here. -->
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
